name: DemoApp

options:
  bundleIdPrefix: com.coreml-llm-samples
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.0.0"

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    EXCLUDED_ARCHS: x86_64

packages:
  CoreLLMKit:
    path: ../..

targets:
  DemoApp:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: DemoApp
    dependencies:
      - package: CoreLLMKit
        product: LLMCore
      - package: CoreLLMKit
        product: CoreMLBackend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreml-llm-samples.DemoApp
        PRODUCT_NAME: DemoApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Core ML Demos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: "NO"
        ENABLE_APP_SANDBOX: "NO"

  DemoApp-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: DemoApp
    dependencies:
      - package: CoreLLMKit
        product: LLMCore
      - package: CoreLLMKit
        product: CoreMLBackend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreml-llm-samples.DemoApp
        PRODUCT_NAME: DemoApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Core ML Demos
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic

schemes:
  DemoApp:
    build:
      targets:
        DemoApp: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
  DemoApp-iOS:
    build:
      targets:
        DemoApp-iOS: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
